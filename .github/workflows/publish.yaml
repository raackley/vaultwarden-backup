name: publish

on:
  push:
    branches: [master]

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: raackley
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/raackley/vaultwarden-backup:latest
            ghcr.io/raackley/vaultwarden-backup:${{ github.sha }}
            raackley/vaultwarden-backup:latest
            raackley/vaultwarden-backup:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Publish charts
        run: |
          for dir in helm/*/; do
            chart=$(basename "$dir")
            version=$(awk '$1 == "version:" {print $2; exit}' "$dir/Chart.yaml")
            echo "Chart: ${chart} ${version}"
            helm dependency update "$dir"
            helm package "$dir" --destination .
            helm push "${chart}-${version}.tgz" oci://ghcr.io/raackley/charts
          done